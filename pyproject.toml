[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scet-toolkit"
version = "0.3.0"
description = "Shoreline Change Estimation Toolkit: extract shorelines from segmented imagery and compute change rates via OpenDSAS"
readme = "README.md"
license = { file = "LICENCE.txt" }
requires-python = ">=3.9"
authors = [{ name = "Boyuan Lu" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy",
    "opencv-python-headless",
    "rasterio",
    "geopandas",
    "shapely",
    "pyproj",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "pillow",
    "opendsas",
    # DeepLabV3+ water segmentation (scet/segmentation.py) is plain PyTorch, so
    # no mmcv/mmsegmentation/GDAL is needed. For a specific CUDA build, install
    # torch from https://pytorch.org first.
    "torch>=2.0",
    "tqdm",
    "ftfy",
    "regex",
]

[project.optional-dependencies]
# Test-suite only. `dsas` (from the "opendsas" core dependency) must be on
# PATH for the end-to-end pipeline tests; they self-skip if it is missing.
test = [
    "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/lubyant/ShorelineCalculator"

[tool.setuptools.packages.find]
include = ["scet*"]

[tool.pytest.ini_options]
# Put the repo root on sys.path so `import tests.synthetic` works without an
# editable install.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end test that shells out to the real `dsas` executable",
]
