name: Build and Test

on:
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*

      - name: Install core package and smoke-test import
        run: |
          python -m pip install dist/*.whl
          python -c "import scet; from scet import SCET, Config; from scet.pipeline import generate_result_from_folder; from scet import dsas_cli"
