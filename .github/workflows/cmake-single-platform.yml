name: Build and Push Docker image

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Login to DockerHub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build 
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          cache-from: type=registry,ref=lubyant1994/shoreline_calculator:cache
          cache-to: type=registry,ref=lubyant1994/shoreline_calculator:cache,mode=max
    - name: Run Docker Container
      run: |
        docker run --rm lubyant1994/shoreline_calculator:latest
    - name: Push to DockerHub
      if: success()
      uses: docker/build-push-action@v2
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: lubyant1994/shoreline_calculator:latest